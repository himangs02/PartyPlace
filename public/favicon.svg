<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1838"/>
      <stop offset="50%" stop-color="#70152F"/>
      <stop offset="100%" stop-color="#4E0C1F"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCCD8"/>
      <stop offset="40%" stop-color="#D94D83"/>
      <stop offset="100%" stop-color="#A0204C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#ppBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Party Popper Cone & Confetti -->
  <g filter="url(#shadow)">
    <!-- Main Cone -->
    <path d="M14 50 L34 46 L20 28 Z" fill="url(#coneGrad)"/>
    
    <!-- Decorative Stripe on Cone -->
    <path d="M16 43 L26 41 L21 34 Z" fill="url(#goldGrad)"/>
    <path d="M18 36 L21 35 L19 32 Z" fill="#FFF0E8"/>

    <!-- Cone Rim -->
    <ellipse cx="27" cy="37" rx="9" ry="3.5" transform="rotate(-36 27 37)" fill="#FFF0E8"/>

    <!-- Confetti Explosion from Rim -->
    <!-- Gold streamer 1 -->
    <path d="M29 32 Q35 24 44 26 Q40 30 32 35 Z" fill="url(#goldGrad)"/>
    <!-- Rose streamer 2 -->
    <path d="M24 28 Q26 18 36 15 Q34 20 28 29 Z" fill="#FFA5BD"/>
    <!-- Mint streamer 3 -->
    <path d="M33 36 Q42 38 49 33 Q44 33 35 38 Z" fill="#34D399"/>

    <!-- Star Spark -->
    <polygon points="46,12 47.5,16 51.5,17.5 47.5,19 46,23 44.5,19 40.5,17.5 44.5,16" fill="#FDE68A"/>

    <!-- Festive Confetti Dots -->
    <circle cx="38" cy="10" r="2.2" fill="#FFFFFF"/>
    <circle cx="51" cy="27" r="2.2" fill="#F472B6"/>
    <circle cx="48" cy="42" r="2" fill="#FBBF24"/>
    <circle cx="21" cy="18" r="1.8" fill="#34D399"/>
    <circle cx="34" cy="22" r="1.6" fill="#FFFFFF"/>
  </g>
</svg>